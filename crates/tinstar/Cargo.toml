[package]
name = "tinstar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml = "0.9.34"
tinstar-core = { version = "0.1.0", path = "../tinstar-core" }
ureq = { version = "3.5.1", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
